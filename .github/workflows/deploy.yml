name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /Price-Tracker-App-/

      - name: Replace service worker to avoid stale caches
        run: |
          # Create a tiny service worker that unregisters itself on activation.
          # This helps edge caches / previously installed workers stop serving old bundles.
          cat > build/web/flutter_service_worker.js <<'SW'
self.addEventListener('install', function(e) { self.skipWaiting(); });
self.addEventListener('activate', function(e) { self.registration.unregister(); });
SW



      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
